# Сборка мобильного клиента (mobile/). Только сборка и тесты — никакого деплоя.
name: Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/core/go.mod
          cache-dependency-path: mobile/core/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"

      - name: Go tests
        working-directory: mobile/core
        run: go test -tags with_gvisor ./...

      - name: End-to-end через TUN (xray ⇄ mihomo)
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            "GOPATH=$(go env GOPATH)" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            ./mobile/core/e2e.sh

      - name: libcore.aar
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: ./mobile/build-core.sh

      - name: APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: sub-lab-client
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
